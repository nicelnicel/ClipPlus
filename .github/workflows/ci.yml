name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "codex/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload artifacts to, for example v0.1.0. Empty means build artifacts only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Rust FFI
        run: cargo build -p clipplus-ffi

      - name: Test Swift package
        run: |
          cd apps/mac
          CLIPPLUS_FFI_LIBRARY_PATH="$PWD/../../target/debug/libclipplus_ffi.dylib" swift test

      - name: Package macOS app
        run: ./scripts/dev/package-mac-app.sh

      - name: Package macOS DMG
        run: ./scripts/dev/package-mac-dmg.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipPlus-macOS-dmg
          path: target/macos/ClipPlus-macOS.dmg

  windows:
    name: Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test Windows app
        shell: pwsh
        run: |
          Set-Location apps/windows
          dotnet test ClipPlus.Windows.sln --nologo

      - name: Publish Windows x64 full exe
        shell: pwsh
        run: |
          ./scripts/dev/publish-windows-single-exe.ps1 -RuntimeIdentifier win-x64
          New-Item -ItemType Directory -Force target/windows-release | Out-Null
          Copy-Item target/windows-single-exe/ClipPlus.Windows.exe target/windows-release/ClipPlus-Windows-x64-full.exe

      - name: Smoke test Windows x64 full exe
        shell: pwsh
        run: |
          $output = "target/windows-release/full-smoke.txt"
          Remove-Item $output -ErrorAction SilentlyContinue
          $env:CLIPPLUS_COREBRIDGE_SMOKE_TEST = "1"
          $env:CLIPPLUS_COREBRIDGE_SMOKE_TEST_OUTPUT = $output
          Remove-Item Env:CLIPPLUS_FFI_LIBRARY_PATH -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "target/windows-release/ClipPlus-Windows-x64-full.exe" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Full Windows exe smoke test failed with exit code $($process.ExitCode)"
          }
          Get-Content $output

      - name: Publish Windows x64 runtime-dependent exe
        shell: pwsh
        run: |
          ./scripts/dev/publish-windows-runtime-dependent.ps1 -RuntimeIdentifier win-x64
          Copy-Item target/windows-runtime-dependent/ClipPlus.Windows.exe target/windows-release/ClipPlus-Windows-x64-runtime-dependent.exe

      - name: Smoke test Windows x64 runtime-dependent exe
        shell: pwsh
        run: |
          $output = "target/windows-release/runtime-dependent-smoke.txt"
          Remove-Item $output -ErrorAction SilentlyContinue
          $env:CLIPPLUS_COREBRIDGE_SMOKE_TEST = "1"
          $env:CLIPPLUS_COREBRIDGE_SMOKE_TEST_OUTPUT = $output
          Remove-Item Env:CLIPPLUS_FFI_LIBRARY_PATH -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath "target/windows-release/ClipPlus-Windows-x64-runtime-dependent.exe" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Runtime-dependent Windows exe smoke test failed with exit code $($process.ExitCode)"
          }
          Get-Content $output

      - name: Upload Windows full exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipPlus-Windows-x64-full
          path: target/windows-release/ClipPlus-Windows-x64-full.exe

      - name: Upload Windows runtime-dependent exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipPlus-Windows-x64-runtime-dependent
          path: target/windows-release/ClipPlus-Windows-x64-runtime-dependent.exe

  release:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs:
      - macos
      - windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          ./scripts/dev/check-release-version.sh "$tag"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/github-release

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$tag" ]]; then
            echo "Release tag is required for release upload." >&2
            exit 2
          fi

          mapfile -t assets < <(find target/github-release -type f \( -name 'ClipPlus-macOS.dmg' -o -name 'ClipPlus-Windows-*.exe' \) | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "ClipPlus ${tag}" \
              --notes "Automated ClipPlus release for ${GITHUB_SHA}."
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
