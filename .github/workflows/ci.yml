name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "codex/**"
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  macos:
    name: macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Rust FFI
        run: cargo build -p clipplus-ffi

      - name: Test Swift package
        run: |
          cd apps/mac
          CLIPPLUS_FFI_LIBRARY_PATH="$PWD/../../target/debug/libclipplus_ffi.dylib" swift test

      - name: Package macOS app
        run: ./scripts/dev/package-mac-app.sh

      - name: Package macOS DMG
        run: ./scripts/dev/package-mac-dmg.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipPlus-macOS-dmg
          path: target/macos/ClipPlus-macOS.dmg

  windows:
    name: Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test Windows app
        shell: pwsh
        run: |
          Set-Location apps/windows
          dotnet test ClipPlus.Windows.sln --nologo

      - name: Publish Windows x64 single-file exe
        shell: pwsh
        run: ./scripts/dev/publish-windows-single-exe.ps1 -RuntimeIdentifier win-x64

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipPlus-Windows-x64
          path: target/windows-single-exe/ClipPlus.Windows.exe
